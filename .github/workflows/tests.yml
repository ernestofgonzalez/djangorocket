name: Tests

# Push is limited to the trunk on purpose. Listing a branch here that is also the
# head of an open pull request runs everything twice -- once for the push, once
# for the PR's synchronize -- so development branches are covered by
# `pull_request` alone, which additionally tests the result of the merge rather
# than the branch tip.
on:
  push:
    branches:
      - main
  pull_request:

# One run per PR (or per branch); a new commit supersedes the run still going for
# the previous one. Never cancel on the trunk, so every commit on main keeps a
# result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements/requirements-testing.txt
      - name: Run tests (e2e skipped)
        run: pytest

  e2e:
    name: End-to-end (generated project on py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the Python range a generated project supports. The top end
      # matters as much as the floor: `make bootstrap` builds the project's
      # virtualenv with whatever `python3` the developer happens to have, and
      # Python 3.14 broke Django 5.0's template context copy -- every page of a
      # fresh project 500ed while this job, pinned to 3.10, stayed green.
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system build dependencies
        # psycopg2 (a generated-project dependency) compiles against libpq.
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements/requirements-testing.txt
      - name: Run end-to-end tests
        # Build the generated project's virtualenv with this job's interpreter
        # rather than letting the suite pick the newest one on the runner.
        env:
          DJANGOROCKET_E2E_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: pytest --run-e2e -m e2e -v
